EXPERIMENT:
  NAME: "CD on cifar100 with both adv samples + train set"
  TAG: "CD,res32x4,res8x4"
  PROJECT: "cifar100_baselines"
DISTILLER:
  TYPE: "CD"
  TEACHER: "resnet32x4"
  STUDENT: "resnet8x4"
SOLVER:
